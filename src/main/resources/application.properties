server.port=8082

spring.application.name=korp-email-service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sistemacomissaotnd@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

broker.exchange.name=${RABBITMQ_EMAIL_EXCHANGE:korp.email.exchange}
broker.queue.name=${RABBITMQ_EMAIL_QUEUE:korp.email.queue}
broker.dead-letter-exchange.name=${RABBITMQ_EMAIL_DLX:korp.email.dlx}
broker.dead-letter-queue.name=${RABBITMQ_EMAIL_DLQ:korp.email.dlq}
broker.dead-letter-routing-key=${RABBITMQ_EMAIL_DLQ_ROUTING_KEY:korp.email.failed}
broker.publisher-confirm-timeout-ms=${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
broker.retry.max-attempts=3
broker.retry.initial-interval-ms=1000
broker.retry.max-interval-ms=2000
broker.retry.multiplier=2.0
